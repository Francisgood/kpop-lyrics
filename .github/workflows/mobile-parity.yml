name: mobile-parity

# Flags PRs that touch surfaces the Aegyo mobile app consumes.
# Contract: docs/MOBILE_CONTRACT.md. Keep the path list below and PARITY_PATTERNS in sync.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "app/api/news/**"
      - "app/api/polls/**"
      - "app/api/chat/**"
      - "app/api/auth/shared/**"
      - "app/api/auth/logout/**"
      - "lib/chat-*"
      - "lib/polls*"
      - "lib/shared-auth/**"
      - "components/FanChatbox.tsx"
      - "components/ChatRegionGate.tsx"
      - "components/PollCard.tsx"
      - "app/chat/**"
      - "middleware.ts"
      - "docs/MOBILE_CONTRACT.md"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: mobile-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/MOBILE_CONTRACT.md
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@v7
        with:
          script: |
            const PARITY_PATTERNS = [
              "app/api/news/**",
              "app/api/polls/**",
              "app/api/chat/**",
              "app/api/auth/shared/**",
              "app/api/auth/logout/**",
              "lib/chat-*",
              "lib/polls*",
              "lib/shared-auth/**",
              "components/FanChatbox.tsx",
              "components/ChatRegionGate.tsx",
              "components/PollCard.tsx",
              "app/chat/**",
              "middleware.ts",
              "docs/MOBILE_CONTRACT.md",
            ];
            const MARKER = "<!-- mobile-parity-guard -->";
            const LABEL = "mobile-parity";

            // "**" crosses directories, "*" stays inside one segment.
            const toRegex = (glob) => new RegExp("^" + glob
              .replace(/[.+^${}()|[\]\\]/g, "\\$&")
              .replace(/\*\*/g, "\u0000")
              .replace(/\*/g, "[^/]*")
              .replace(/\u0000/g, ".*") + "$");
            const matchers = PARITY_PATTERNS.map(toRegex);

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });
            const paths = new Set();
            for (const f of files) {
              paths.add(f.filename);
              if (f.previous_filename) paths.add(f.previous_filename);
            }
            const matched = [...paths].filter((p) => matchers.some((re) => re.test(p))).sort();
            if (matched.length === 0) {
              core.info("No mobile-consumed paths changed.");
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name: LABEL, color: "d93f0b",
                  description: "Touches a surface the Aegyo mobile app consumes",
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError; // created concurrently
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [LABEL] });

            const contractUrl = `${context.serverUrl}/${owner}/${repo}/blob/${pr.head.sha}/docs/MOBILE_CONTRACT.md`;
            const body = [
              MARKER,
              "### Mobile parity check",
              "",
              "This PR changes files the Aegyo mobile app (`Myosin-xyz/aegyo-mobile`) depends on:",
              "",
              ...matched.map((p) => `- \`${p}\``),
              "",
              "Copy this into the PR description and tick what applies:",
              "",
              "- [ ] No mobile-consumed surface changed",
              "- [ ] Contract updated in docs/MOBILE_CONTRACT.md",
              "- [ ] Mirror issue opened in aegyo-mobile: #___",
              "",
              "Mirror issue command: `gh issue create --repo Myosin-xyz/aegyo-mobile --label web-parity --title \"web-parity: <change>\"`",
              "",
              `Contract: [docs/MOBILE_CONTRACT.md](${contractUrl})`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
